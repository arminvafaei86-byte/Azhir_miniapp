<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#111111">
  <title>Azhir Mini App</title>

  <!-- Graspil: after adding this Mini App in Graspil, replace YOUR_GRASPIL_KEY
       with the key Graspil gives you. -->
  <script type="text/javascript">
    (function(w,d,s,l,i){
      w[l]=w[l]||[];
      w[l].push({key:i});
      var f=d.getElementsByTagName(s)[0],
          j=d.createElement(s);
      j.async=true;
      j.src="https://w.graspil.com";
      f.parentNode.insertBefore(j,f);
    })(window,document,"script","graspil","YOUR_GRASPIL_KEY");
  </script>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    *{box-sizing:border-box}
    body{
      margin:0; min-height:100vh; display:flex; align-items:center; justify-content:center;
      background:#111;color:#fff;font-family:Arial,sans-serif;padding:24px;
    }
    .card{
      width:100%;max-width:420px;background:#1b1b1b;border-radius:22px;
      padding:28px;text-align:center;box-shadow:0 12px 40px rgba(0,0,0,.35)
    }
    .avatar{
      width:72px;height:72px;border-radius:50%;display:flex;align-items:center;
      justify-content:center;background:#2aabee;color:#fff;font-size:30px;
      margin:0 auto 18px;font-weight:700
    }
    h1{font-size:22px;margin:0 0 8px}
    p{color:#aaa;margin:0 0 22px}
    .info{text-align:left;background:#111;border-radius:14px;padding:14px}
    .row{display:flex;justify-content:space-between;gap:12px;padding:9px 0;border-bottom:1px solid #292929}
    .row:last-child{border-bottom:0}
    .label{color:#888}.value{word-break:break-all;text-align:right}
  </style>
</head>
<body>
  <main class="card">
    <div class="avatar" id="avatar">A</div>
    <h1 id="title">Azhir Mini App</h1>
    <p>در حال ثبت ورود شما…</p>

    <section class="info">
      <div class="row"><span class="label">Telegram ID</span><span class="value" id="id">—</span></div>
      <div class="row"><span class="label">Username</span><span class="value" id="username">—</span></div>
      <div class="row"><span class="label">Name</span><span class="value" id="name">—</span></div>
    </section>
  </main>

  <script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) {
      tg.ready();
      tg.expand();

      const user = tg.initDataUnsafe && tg.initDataUnsafe.user;
      if (user) {
        document.getElementById("id").textContent = user.id ?? "—";
        document.getElementById("username").textContent =
          user.username ? "@" + user.username : "—";
        document.getElementById("name").textContent =
          [user.first_name, user.last_name].filter(Boolean).join(" ") || "—";
        document.getElementById("title").textContent =
          "سلام " + (user.first_name || "") + " 👋";
        document.getElementById("avatar").textContent =
          (user.first_name || "A").charAt(0).toUpperCase();

        // Graspil's documented Mini App initialization.
        if (window.graspil) {
          window.graspil.push({
            custom_init_data_row: tg.initData,
            platform: tg.platform,
            version: tg.version,
            viewportHeight: tg.viewportHeight,
            viewportStableHeight: tg.viewportStableHeight,
            colorScheme: tg.colorScheme
          });
        }
      }
    }
  </script>
</body>
</html>
